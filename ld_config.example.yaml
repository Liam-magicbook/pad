# Smallest runnable node config: local PAD server + a fake LD, verify the whole pipeline in 5 min.
#
#   PAD_KEY=devkey PAD_DB=/tmp/pad.db .venv/bin/python -m uvicorn server:app --port 8790
#   PAD_KEY=devkey .venv/bin/python ld_agent.py ld_config.example.yaml
#
# Echo-only, just to prove it runs. For real use, follow ld_config.node.yaml.example.

node_id: local-1
role: publisher

capabilities:
  demo.echo:
    desc: "最小示例：回一句 pong，证明注册/领活/报告三段都通"
    cmd: "echo \"pong from $(hostname -s) at $(date +%H:%M)\""
    timeout_min: 1

pad_url: "http://127.0.0.1:8790/pad/${PAD_KEY}"
poll_sec: 5
work_dir: "/tmp/pad-work"
